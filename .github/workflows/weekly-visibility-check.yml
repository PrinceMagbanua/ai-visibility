name: Weekly AI Visibility Check

on:
  schedule:
    # Every Monday at 21:00 UTC (~8am AEST Tuesday)
    - cron: "0 21 * * 1"
  workflow_dispatch: {}

jobs:
  run-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npm run check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --staged --quiet || git commit -m "chore: weekly AI visibility check results"
          git push
