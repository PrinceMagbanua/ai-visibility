name: Diagnose Gemini Quota

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: node src/diagnose-quota.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
